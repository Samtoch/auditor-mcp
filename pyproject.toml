[project]
name = "auditor-mcp"
version = "0.4.0"
description = "MCP server that keeps an audit log of conversation turns."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.2",
    "mcp[cli]>=2.3,<3",
    "msal>=1.39.0",
    "psycopg2-binary>=2.9.13",
    "pyjwt[crypto]>=2.15.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
auditor-mcp = "auditor_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auditor_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
