[project]
name = "auditor-mcp"
version = "0.5.0"
description = "MCP audit server and security gateway that pins tool definitions against tool poisoning."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.3,<3",
    "msal>=1.39.0",
    "pyjwt[crypto]>=2.15.1",
]

[project.scripts]
auditor-mcp = "auditor_mcp.__main__:main"
auditor-gateway = "auditor_mcp.gateway.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auditor_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
timeout = 60

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
